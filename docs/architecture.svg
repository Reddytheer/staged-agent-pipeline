<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 400" width="1130" height="400" role="img" aria-label="Inputs flow through an orchestrator into five agent steps: intake, extraction, normalization, validation, and an underwriting-ready package. Low-confidence results at extraction, normalization and validation go to a human review queue, whose corrections feed an evaluation layer that gates every release.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17212b"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b25e09"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2457a6"/></marker>
  </defs>
  <rect width="1130" height="400" fill="#ffffff"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" fill="#17212b">

  <!-- Inputs -->
  <rect x="8" y="72" width="138" height="200" rx="8" fill="#f6f8fa" stroke="#c9d1d9"/>
  <text x="77" y="94" text-anchor="middle" font-size="13" font-weight="700">Inputs</text>
  <text x="20" y="118" font-size="11.5">Renewal submissions</text>
  <text x="20" y="140" font-size="11.5">Schedules of values</text>
  <text x="20" y="162" font-size="11.5">Declarations pages</text>
  <text x="20" y="184" font-size="11.5">COPE details</text>
  <text x="20" y="206" font-size="11.5">3 provider formats</text>
  <text x="77" y="236" text-anchor="middle" font-size="10.5" fill="#5b6672">any format, any provider</text>
  <text x="77" y="252" text-anchor="middle" font-size="10.5" fill="#5b6672">synthetic, seeded</text>
  <line x1="146" y1="150" x2="172" y2="150" stroke="#17212b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Orchestrator -->
  <rect x="176" y="8" width="776" height="40" rx="8" fill="#17212b"/>
  <text x="564" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Orchestrator</text>
  <text x="564" y="41" text-anchor="middle" font-size="10.5" fill="#d7dde3">orchestrator.py: runs each step, routes ambiguity to a model tier by stakes, decides what needs a person</text>
  <g stroke="#17212b" stroke-dasharray="3 3" stroke-width="1">
    <line x1="244" y1="48" x2="244" y2="72"/><line x1="400" y1="48" x2="400" y2="72"/><line x1="556" y1="48" x2="556" y2="72"/><line x1="712" y1="48" x2="712" y2="72"/><line x1="868" y1="48" x2="868" y2="72"/>
  </g>

  <!-- Stages -->
  <g>
    <rect x="176" y="72" width="136" height="150" rx="8" fill="#fff" stroke="#17212b" stroke-width="1.3"/>
    <text x="244" y="93" text-anchor="middle" font-size="10.5" fill="#5b6672">STEP 1</text>
    <text x="244" y="111" text-anchor="middle" font-size="13" font-weight="700">Intake &amp; classify</text>
    <text x="244" y="133" text-anchor="middle" font-size="10.8">What is this document,</text>
    <text x="244" y="147" text-anchor="middle" font-size="10.8">which property, which</text>
    <text x="244" y="161" text-anchor="middle" font-size="10.8">policy period?</text>
    <rect x="196" y="186" width="96" height="22" rx="11" fill="#e9f6ef"/><text x="244" y="201" text-anchor="middle" font-size="10.5" fill="#1f7a4d" font-weight="600">rules</text>
  </g>
  <g>
    <rect x="332" y="72" width="136" height="150" rx="8" fill="#fff" stroke="#17212b" stroke-width="1.3"/>
    <text x="400" y="93" text-anchor="middle" font-size="10.5" fill="#5b6672">STEP 2</text>
    <text x="400" y="111" text-anchor="middle" font-size="13" font-weight="700">Extract</text>
    <text x="400" y="133" text-anchor="middle" font-size="10.8">Label maps pull each</text>
    <text x="400" y="147" text-anchor="middle" font-size="10.8">field with its source</text>
    <text x="400" y="161" text-anchor="middle" font-size="10.8">line and a confidence</text>
    <rect x="352" y="186" width="96" height="22" rx="11" fill="#e9f6ef"/><text x="400" y="201" text-anchor="middle" font-size="10.5" fill="#1f7a4d" font-weight="600">rules + citation</text>
  </g>
  <g>
    <rect x="488" y="72" width="136" height="150" rx="8" fill="#fff" stroke="#17212b" stroke-width="1.3"/>
    <text x="556" y="93" text-anchor="middle" font-size="10.5" fill="#5b6672">STEP 3</text>
    <text x="556" y="111" text-anchor="middle" font-size="13" font-weight="700">Normalize</text>
    <text x="556" y="133" text-anchor="middle" font-size="10.8">Map every provider's</text>
    <text x="556" y="147" text-anchor="middle" font-size="10.8">format into one shared</text>
    <text x="556" y="161" text-anchor="middle" font-size="10.8">schema, reconcile docs</text>
    <rect x="497" y="186" width="118" height="22" rx="11" fill="#e9f6ef"/><text x="556" y="201" text-anchor="middle" font-size="10.5" fill="#1f7a4d" font-weight="600">rules, then model tier</text>
  </g>
  <g>
    <rect x="644" y="72" width="136" height="150" rx="8" fill="#fff" stroke="#17212b" stroke-width="1.3"/>
    <text x="712" y="93" text-anchor="middle" font-size="10.5" fill="#5b6672">STEP 4</text>
    <text x="712" y="111" text-anchor="middle" font-size="13" font-weight="700">Validate</text>
    <text x="712" y="133" text-anchor="middle" font-size="10.8">Checks coverage vs.</text>
    <text x="712" y="147" text-anchor="middle" font-size="10.8">values, sprinklers, fire</text>
    <text x="712" y="161" text-anchor="middle" font-size="10.8">protection; cites source</text>
    <rect x="664" y="186" width="96" height="22" rx="11" fill="#fff4e5"/><text x="712" y="201" text-anchor="middle" font-size="10.5" fill="#b25e09" font-weight="600">rules + conflicts</text>
  </g>
  <g>
    <rect x="800" y="72" width="152" height="150" rx="8" fill="#eaf1fb" stroke="#2457a6" stroke-width="1.5"/>
    <text x="876" y="93" text-anchor="middle" font-size="10.5" fill="#2457a6">STEP 5</text>
    <text x="876" y="111" text-anchor="middle" font-size="13" font-weight="700">Underwriting-ready</text>
    <text x="876" y="133" text-anchor="middle" font-size="10.8">Structured exposure and</text>
    <text x="876" y="147" text-anchor="middle" font-size="10.8">coverage data, gaps</text>
    <text x="876" y="161" text-anchor="middle" font-size="10.8">flagged, evidence attached</text>
    <rect x="820" y="186" width="112" height="22" rx="11" fill="#fff"/><text x="876" y="201" text-anchor="middle" font-size="10.5" fill="#2457a6" font-weight="600">audit trail per field</text>
  </g>
  <g stroke="#17212b" stroke-width="1.6">
    <line x1="312" y1="147" x2="328" y2="147" marker-end="url(#ar)"/>
    <line x1="468" y1="147" x2="484" y2="147" marker-end="url(#ar)"/>
    <line x1="624" y1="147" x2="640" y2="147" marker-end="url(#ar)"/>
    <line x1="780" y1="147" x2="796" y2="147" marker-end="url(#ar)"/>
    <line x1="952" y1="147" x2="980" y2="147" marker-end="url(#ar)"/>
  </g>

  <!-- Underwriter -->
  <rect x="984" y="102" width="138" height="90" rx="8" fill="#17212b"/>
  <text x="1053" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Underwriter</text>
  <text x="1053" y="152" text-anchor="middle" font-size="10.8" fill="#d7dde3">prices the risk on</text>
  <text x="1053" y="166" text-anchor="middle" font-size="10.8" fill="#d7dde3">clean, cited data</text>

  <!-- Confidence gates to human review -->
  <g stroke="#b25e09" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
    <line x1="400" y1="222" x2="400" y2="270" marker-end="url(#arA)"/>
    <line x1="556" y1="222" x2="556" y2="270" marker-end="url(#arA)"/>
    <line x1="712" y1="222" x2="712" y2="270" marker-end="url(#arA)"/>
  </g>
  <g font-size="10.3" fill="#b25e09" font-weight="600">
    <text x="406" y="244">below field</text><text x="406" y="256">threshold</text>
    <text x="562" y="244">no confident</text><text x="562" y="256">mapping</text>
    <text x="718" y="244">documents</text><text x="718" y="256">disagree</text>
  </g>
  <path d="M 860 270 L 860 236 L 876 236 L 876 226" stroke="#b25e09" stroke-width="1.4" fill="none" marker-end="url(#arA)"/>
  <text x="884" y="246" font-size="10.3" fill="#b25e09" font-weight="600">approved or</text>
  <text x="884" y="258" font-size="10.3" fill="#b25e09" font-weight="600">corrected</text>

  <rect x="332" y="272" width="620" height="44" rx="8" fill="#fff4e5" stroke="#b25e09"/>
  <text x="642" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a3f05">Human review queue: people see only what the agents are unsure about</text>
  <text x="642" y="306" text-anchor="middle" font-size="10.8" fill="#7a3f05">each item shows the field, the source page and the citation, so the reviewer decides with the evidence in view</text>

  <!-- Eval layer -->
  <line x1="642" y1="316" x2="642" y2="338" stroke="#2457a6" stroke-width="1.4" marker-end="url(#arB)"/>
  <text x="650" y="331" font-size="10.3" fill="#2457a6" font-weight="600">reviewed outcomes are the evidence that earns autonomy</text>
  <rect x="176" y="342" width="776" height="52" rx="8" fill="#eaf1fb" stroke="#2457a6"/>
  <text x="564" y="361" text-anchor="middle" font-size="12.5" font-weight="700" fill="#173e7a">Evaluation &amp; trust layer: nothing ships unless it passes</text>
  <text x="564" y="380" text-anchor="middle" font-size="10.6" fill="#173e7a">ground-truth evals · autonomy ladder per decision type · A/B variants · drift drill · release gate in CI</text>
  <path d="M 952 368 L 1053 368 L 1053 196" stroke="#2457a6" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arB)"/>
  <text x="958" y="386" font-size="10.3" fill="#2457a6" font-weight="600">gates every release</text>
  </g>
</svg>
